name: Build Vyra (TV app + iPhone web app)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip the newest uploaded project zip
        run: |
          ZIP=$(git log -1 --diff-filter=AM --name-only --format= -- '*.zip' | head -1)
          echo "Using: $ZIP"
          unzip -q "$ZIP" -d src
          echo "PROJECT=$(dirname "$(find src -maxdepth 2 -name gradlew | head -1)")" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cd "$PROJECT"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Vyra.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Vyra-apk
          path: Vyra.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Vyra (latest build)
          files: Vyra.apk
          make_latest: true

  iphone-web:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Unzip the newest uploaded project zip
        run: |
          ZIP=$(git log -1 --diff-filter=AM --name-only --format= -- '*.zip' | head -1)
          unzip -q "$ZIP" -d src
          PROJECT=$(dirname "$(find src -maxdepth 2 -name gradlew | head -1)")
          mkdir -p site && cp -r "$PROJECT/web/." site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
