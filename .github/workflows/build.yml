name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip the newest uploaded project zip
        run: |
          ZIP=$(git log -1 --diff-filter=AM --name-only --format= -- '*.zip' | head -1)
          echo "Using: $ZIP"
          unzip -q "$ZIP" -d src
          PROJECT=$(dirname "$(find src -maxdepth 2 -name gradlew | head -1)")
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cd "$PROJECT"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Vyra.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Vyra-apk
          path: Vyra.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Vyra (latest build)
          files: Vyra.apk
          make_latest: true
